name: Generate LLM Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/rag_rules.txt
      - config/config.yaml
      - src/**

concurrency:
  group: generate-docs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Download embedding model
        env:
          HF_HUB_OFFLINE: "0"
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_HUB_OFFLINE: "1"
        run: python run_pipeline.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llmdocs-output
          path: |
            release/jac-llmdocs.md
            jac-llmdocs.validation.json

      - name: Commit updated docs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/jac-llmdocs.md release/VERSION jac-llmdocs.validation.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate jac-llmdocs for v$(cat release/VERSION)"
          git push
